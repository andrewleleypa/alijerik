  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --void:#05060a; --deep:#0a0a0f; --plasma:#00e5ff; --lava:#ff3d00;
      --nebula:#7b2fff; --text:#f0f0f0;
      --display:"Orbitron",system-ui,sans-serif;
      --mono:"Space Mono",ui-monospace,monospace;
    }
    body{
      background:var(--void);color:var(--text);
      font-family:var(--mono);line-height:1.6;
      min-height:100svh;display:flex;flex-direction:column;
    }
    /* El clip va en main, no en body: overflow en body se propaga al viewport. */
    main{overflow-x:clip;flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px 24px;position:relative;isolation:isolate}
    a:focus-visible{outline:2px solid var(--plasma);outline-offset:3px;border-radius:8px}

    /* ── Fondo: disco de acreción en CSS, sin canvas ni JS ── */
    .fondo{position:fixed;inset:0;z-index:-2;pointer-events:none;
      background:
        radial-gradient(circle at 50% 32%, rgba(255,61,0,.16) 0%, transparent 34%),
        radial-gradient(circle at 50% 32%, rgba(0,229,255,.10) 22%, transparent 52%),
        radial-gradient(ellipse 90% 60% at 50% 30%, rgba(123,47,255,.10) 0%, transparent 62%),
        var(--void);
    }
    /* Malla de módulos: el motivo propio de esta página es el QR mismo. */
    .malla{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.055;
      background-image:linear-gradient(var(--plasma) 1px,transparent 1px),linear-gradient(90deg,var(--plasma) 1px,transparent 1px);
      background-size:34px 34px;
      -webkit-mask-image:radial-gradient(ellipse 70% 55% at 50% 34%,#000 0%,transparent 72%);
      mask-image:radial-gradient(ellipse 70% 55% at 50% 34%,#000 0%,transparent 72%);
    }

    .tarjeta{width:100%;max-width:430px}

    /* ── Cabecera ── */
    .marca{display:flex;justify-content:center;margin-bottom:26px}
    .marca svg{width:62px;height:62px;filter:drop-shadow(0 0 26px rgba(0,229,255,.35))}

    .quien{text-align:center}
    .nombre{
      font-family:var(--display);font-weight:900;
      font-size:clamp(25px,7vw,34px);letter-spacing:.02em;line-height:1.1;
      color:transparent;background:linear-gradient(100deg,#fff 0%,#b8f3ff 48%,#18e3ff 100%);
      -webkit-background-clip:text;background-clip:text;
    }
    .cargo{margin-top:12px;font-size:12px;letter-spacing:.2em;color:rgba(240,240,240,.5);text-transform:uppercase}
    .casa{
      margin-top:16px;display:inline-flex;align-items:center;gap:8px;
      padding:7px 15px;border-radius:999px;font-size:11.5px;letter-spacing:.16em;
      color:var(--plasma);box-shadow:inset 0 0 0 1px rgba(0,229,255,.26);
      background:rgba(0,229,255,.05);
    }
    .casa svg{width:13px;height:13px}

    /* ── Acción principal: la única cosa que importa al escanear ── */
    .guardar{
      margin-top:32px;display:flex;align-items:center;justify-content:center;gap:11px;
      padding:17px 22px;border-radius:14px;text-decoration:none;
      background:var(--lava);color:#0b0603;
      font-family:var(--display);font-weight:700;font-size:13.5px;letter-spacing:.09em;
      box-shadow:0 12px 38px rgba(255,61,0,.34);
      transition:transform .25s ease, box-shadow .3s ease;
    }
    .guardar svg{width:19px;height:19px}
    .guardar:hover{transform:translateY(-2px);box-shadow:0 18px 50px rgba(255,61,0,.46)}

    /* ── Canales ── */
    .canales{list-style:none;margin-top:12px;display:grid;gap:9px}
    .canal{
      display:flex;align-items:center;gap:14px;padding:14px 15px;border-radius:13px;
      text-decoration:none;color:var(--text);background:rgba(255,255,255,.028);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.055);
      transition:transform .22s ease, box-shadow .3s ease, background .3s ease;
    }
    a.canal:hover{transform:translateX(4px);background:rgba(0,229,255,.05);
      box-shadow:inset 0 0 0 1px rgba(0,229,255,.3), 0 0 26px rgba(0,229,255,.08)}
    .canal__ic{display:grid;place-items:center;width:40px;height:40px;flex:none;border-radius:11px;
      color:var(--plasma);background:rgba(0,229,255,.09)}
    .canal__ic svg{width:21px;height:21px}
    .canal__t{display:flex;flex-direction:column;gap:2px;min-width:0}
    .canal__k{font-family:var(--display);font-size:9.5px;letter-spacing:.24em;color:rgba(240,240,240,.42)}
    .canal__v{font-size:14.5px;line-height:1.4;overflow-wrap:anywhere}
    .canal--fijo{cursor:default}
    .canal--fijo .canal__v{font-size:13px;color:rgba(240,240,240,.82)}

    /* ── Eficore: el producto, no un enlace más ── */
    .producto{
      margin-top:22px;display:flex;align-items:center;gap:13px;padding:15px 16px;border-radius:15px;
      text-decoration:none;color:var(--text);
      background:linear-gradient(180deg,rgba(123,47,255,.12),rgba(255,255,255,.02));
      box-shadow:inset 0 0 0 1px rgba(123,47,255,.28);
      transition:transform .25s ease, box-shadow .3s ease;
    }
    .producto:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 1px rgba(123,47,255,.5), 0 0 30px rgba(123,47,255,.16)}
    .producto__ic{display:grid;place-items:center;width:40px;height:40px;flex:none;border-radius:11px;
      color:#c9a8ff;background:rgba(123,47,255,.18)}
    .producto__ic svg{width:22px;height:22px}
    .producto__t{margin-right:auto;display:flex;flex-direction:column;gap:3px;min-width:0}
    .producto__n{font-family:var(--display);font-weight:700;font-size:13.5px;letter-spacing:.09em}
    .producto__d{font-size:11.5px;color:rgba(240,240,240,.55);line-height:1.45}
    .producto__go{font-size:16px;color:#c9a8ff;flex:none}

    /* ── El pie que convierte: quien escanea ve que esto se vende ── */
    .venta{
      margin-top:26px;padding-top:22px;border-top:1px solid rgba(255,255,255,.07);
      text-align:center;font-size:12px;color:rgba(240,240,240,.44);line-height:1.75;
    }
    .venta a{color:var(--plasma);text-decoration:none;border-bottom:1px solid rgba(0,229,255,.3)}
    .venta a:hover{border-color:var(--plasma)}

    footer{padding:0 20px 30px;text-align:center;font-size:10.5px;letter-spacing:.05em;color:rgba(240,240,240,.3)}

    @media (max-width:420px){
      main{padding:28px 16px 20px}
      .marca svg{width:54px;height:54px}
    }
    @media (prefers-reduced-motion: reduce){
      .guardar:hover,.producto:hover,a.canal:hover{transform:none}
    }
  </style>
</head>
